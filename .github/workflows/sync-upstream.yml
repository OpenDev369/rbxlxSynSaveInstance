name: Sync Upstream

on:
  schedule:
    # 每天北京时间 10:17（UTC 02:17）
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo sync "$GITHUB_REPOSITORY" \
            --source rbxlx/UniversalSynSaveInstance \
            --branch main
